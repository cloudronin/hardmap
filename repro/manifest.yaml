  - id: mosaic.supply.channelB
    description: "Quarry v2 Channel-B verified net-new both-real supply (dual-pass R20): 22"
    tier: fast
    fast: "hardmap.claims.mosaic_claims:supply_channelB"
    artifact: eightfold/eightfold/results/atlas/quarry-v2-fills.jsonl
    expected: {n_verified_fills: 22}
    tolerance: {n_verified_fills: {abs: 0}}

  # --- Anatomy (Structure Atlas) — S4. The repo's FIRST artifact-hash claims: `artifact:` has always been
  # declarative (never read by any code), so the digest is pinned via an adapter that computes it.
  - id: anatomy.artifact.sha256
    description: "Anatomy v1 frozen artifact — bytes and shape (4417 rows: 345 natural + 4072 boolean)"
    tier: fast
    fast: "hardmap.claims.anatomy_claims:artifact_sha256"
    artifact: eightfold/eightfold/results/atlas/anatomy_v1.jsonl
    expected:
      sha256: "8ff11f8a33bbdce7c6fbd3cf2607aad48462240720b90fa511c2350d9dcb5182"
      n_rows: 4417
      n_natural: 345
      n_boolean: 4072
    tolerance: exact

  - id: anatomy.passports.verdicts
