    tier: fast
    fast: "hardmap.claims.mosaic_claims:power_3class"
    artifact: eightfold/eightfold/results/atlas/quarry-v2-fills.jsonl
    expected: {n: 111, cells_ge5: 7, clears_floor: false}
    tolerance:
