      forbidden_violations: {abs: 0}
      gap_cells_newly_inhabited: {abs: 0}

  - id: bets.b5.folklore.v3new
    description: "B5 folklore gap -- v3-new counting published-proof fraction (HOLDS: 0.18 vs v2 0.31, widened)"
    tier: fast
    fast: "hardmap.claims.bets_claims:folklore_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3.jsonl
    expected: {published_proof_fraction: 0.182}
    tolerance: {published_proof_fraction: {abs: 0.005}}

  - id: bets.b6.funnel.rn.v3new
    description: "B6 funnel homogeneity on rn_membership (HOLDS weakly: present 0.39 > absent 0.10, no outlier)"
    tier: fast
    fast: "hardmap.claims.bets_claims:funnel_rn_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3_provenance.jsonl
    expected: {V_rn_present: 0.3887, V_rn_absent: 0.1043}
    tolerance:
      V_rn_present: {abs: 0.005}
      V_rn_absent: {abs: 0.005}

  # --- Quarry v2: absorption close-out (prereg_v13), recomputed from frozen atlas_v3 + verified fills ---
  # QC: the 22 Channel-B param fills are dual-pass R20-verified, in a sidecar, owner-confirm-pending
  # (E-track). Nothing rescores; these claim the close-out's headline numbers (absorption-closeout.md).
  - id: mosaic.split.pooled
    description: "Two-property SPLIT on pooled-111: locality carries approximation (V 0.55), not parameterized (V 0.23)"
    tier: fast
    fast: "hardmap.claims.mosaic_claims:split_pooled"
    artifact: eightfold/eightfold/results/atlas/quarry-v2-fills.jsonl
    expected: {n: 111, V_loc_approx: 0.547, V_loc_param: 0.231}
    tolerance:
      n: {abs: 0}
      V_loc_approx: {abs: 0.005}
      V_loc_param: {abs: 0.005}

  - id: mosaic.absorption.2class
    description: "Absorption 2-class powered MISS: uncond 0.283 -> cond 0.453, shrinkage -0.60 (does NOT absorb)"
    tier: fast
    fast: "hardmap.claims.mosaic_claims:absorption_2class"
    artifact: eightfold/eightfold/results/atlas/quarry-v2-fills.jsonl
    expected: {uncond_V: 0.283, cond_2class_V: 0.453, shrinkage: -0.6, absorbs: false}
    tolerance:
      uncond_V: {abs: 0.005}
      cond_2class_V: {abs: 0.005}
      shrinkage: {abs: 0.01}
      absorbs: exact

  - id: mosaic.power.3class
