# hardmap repro manifest -- every paper-cited number, its regenerator, and its
# expected value + tolerance. `hardmap repro --all` recomputes each fast-tier
# statistic from the frozen committed artifacts and diffs within tolerance.
#
# tolerance: "exact" (whole claim) or per-field {abs|rel|max|min|range}.
# tier: fast (recompute from committed artifacts) | full (regenerate from scratch).

claims:
  - id: canon.gradient.v
    description: "Hardness-gradient Cramér's V (approx->param), full and dedup rosters"
    tier: fast
    fast: "hardmap.claims.eightfold_claims:gradient_v"
    artifact: eightfold/eightfold/results/atlas/crucible_results.json
    expected:
      full_v: 0.7293
      dedup_v: 0.6807
      perm_p: 0.0001
    tolerance:
      full_v: {abs: 0.001}
      dedup_v: {abs: 0.001}
      perm_p: {max: 0.0005}

  - id: canon.crucible.verdicts
    description: "Crucible S1/S2/S3/S5 verdicts (S4 deferred)"
    tier: fast
    fast: "hardmap.claims.eightfold_claims:crucible_verdicts"
    artifact: eightfold/eightfold/results/atlas/crucible_results.json
    tolerance: exact
    expected:
      S1: RESIZED
      S2: SURVIVES
      S3: SURVIVES
      S5: SURVIVES

  - id: factors.kstar
    description: "Effective dimensionality k* of the charge atlas (LCM 1-SE estimator)"
    tier: fast
    fast: "hardmap.claims.eightfold_claims:factors_kstar_fast"
    full: "hardmap.claims.eightfold_claims:factors_kstar_full"
    artifact: eightfold/eightfold/results/atlas/factors_v1.json
    expected:
      k_star: 1
    tolerance:
      k_star: {abs: 0}

  # --- foundry: the oracle line (read the committed verified matrices) ---
  - id: natural.v3.v
    description: "Generated-universe coupling Cramér's V with bootstrap CI (Lattice v3)"
    tier: fast
    fast: "hardmap.claims.foundry_claims:natural_v3_v"
    artifact: foundry/foundry/results/lattice/lattice_v3_occupancy.json
    expected:
      v: 0.2555
      ci_lo: 0.13
      ci_hi: 0.398
    tolerance:
      v: {abs: 0.005}
      ci_lo: {abs: 0.01}
      ci_hi: {abs: 0.01}

  - id: natural.prism.residuals
    description: "Prism bridge-completed Min-Ones residual: 0.459 (v1) and 0.516 (v2 arity-4 V)"
    tier: fast
    fast: "hardmap.claims.foundry_claims:prism_residuals"
    artifact: foundry/foundry/results/lattice/prism_v2_matrix.json
    expected:
      v1_minones_bridge: 0.459
      v2_minones_V: 0.516
    tolerance:
      v1_minones_bridge: {abs: 0.002}
      v2_minones_V: {abs: 0.002}

  - id: natural.direction.corrected
    description: "Corrected Spearman: -0.564 (v1 anchor), -0.140 arity-4, CI (-0.166, -0.114)"
    tier: fast
    fast: "hardmap.claims.foundry_claims:direction_corrected"
    artifact: foundry/foundry/results/lattice/prism_v2_matrix.json
    expected:
      v1_anchor: -0.564
      arity4_point: -0.140
      ci_lo: -0.166
      ci_hi: -0.114
    tolerance:
      v1_anchor: {abs: 0.002}
      arity4_point: {abs: 0.005}
      ci_lo: {abs: 0.005}
      ci_hi: {abs: 0.005}

  # --- proof-census: recompute the C3 aggregate from the committed checkpoint ---
  - id: census.backbone
    description: "S2 mean backbone at n=60: ~1 (over-constrained) to ~273 (near threshold)"
    tier: fast
    fast: "hardmap.claims.census_claims:backbone"
    artifact: proof-census/proofcensus/results/c3/c3_summary.json
    expected:
      backbone_n60_near_threshold: 272.6
      backbone_n60_over_constrained: 1.0
    tolerance:
      backbone_n60_near_threshold: {abs: 0.5}
      backbone_n60_over_constrained: {abs: 0.1}

  - id: census.plurality
    description: "Median proof-Jaccard band 0.04-0.16, far below the 0.95 no-plurality kill line"
    tier: fast
    fast: "hardmap.claims.census_claims:plurality"
    artifact: proof-census/proofcensus/results/c3/c3_summary.json
    expected:
      jaccard_min: 0.044
      jaccard_max: 0.16
      below_plurality_line: true
    tolerance:
      jaccard_min: {range: [0.03, 0.06]}
      jaccard_max: {range: [0.13, 0.18]}
      below_plurality_line: exact

  # --- quarry V4: the six sealed prereg_v9 bets, recomputed from frozen atlas_v3.jsonl ---
  # QC: v3 cells are agent-double-passed, owner-unconfirmed (trust-labels.md). 5 hold; B1 falsified.
  - id: bets.b1.gradient.v3new
    description: "B1 gradient robustness -- v3-new approx<->param V (FALSIFIED: 0.0, below v2 CI [0.53,0.92])"
    tier: fast
    fast: "hardmap.claims.bets_claims:gradient_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3_bets_v4.json
    expected: {v3new_V_corrected: 0.0}
    tolerance: {v3new_V_corrected: {abs: 0.001}}

  - id: bets.b2.kstar.v3new
    description: "B2 incompressibility -- k* on v3-new (HOLDS: 1, no second dimension at 3x roster)"
    tier: fast
    fast: "hardmap.claims.bets_claims:kstar_v3new_fast"
    full: "hardmap.claims.bets_claims:kstar_v3new_full"
    artifact: eightfold/eightfold/results/atlas/atlas_v3_bets_v4.json
    expected: {k_star: 1}
    tolerance: {k_star: {abs: 0}}

  - id: bets.b3.npi.v3new
    description: "B3 NPI calibration -- count of v3-new NPI-candidate rows (HOLDS: 0, no inflation)"
    tier: fast
    fast: "hardmap.claims.bets_claims:npi_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3.jsonl
    expected: {n_npi: 0}
    tolerance: {n_npi: {abs: 0}}

  - id: bets.b4.occupancy.v3new
    description: "B4 occupancy -- PH×FPT inhabited, 0 forbidden violations, 6 gap cells newly filled (HOLDS)"
    tier: fast
    fast: "hardmap.claims.bets_claims:occupancy_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3.jsonl
    expected: {ph_fpt_inhabited: true, forbidden_violations: 0, gap_cells_newly_inhabited: 6}
    tolerance:
      ph_fpt_inhabited: exact
      forbidden_violations: {abs: 0}
      gap_cells_newly_inhabited: {abs: 0}

  - id: bets.b5.folklore.v3new
    description: "B5 folklore gap -- v3-new counting published-proof fraction (HOLDS: 0.18 vs v2 0.31, widened)"
    tier: fast
    fast: "hardmap.claims.bets_claims:folklore_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3.jsonl
    expected: {published_proof_fraction: 0.182}
    tolerance: {published_proof_fraction: {abs: 0.005}}

  - id: bets.b6.funnel.rn.v3new
    description: "B6 funnel homogeneity on rn_membership (HOLDS weakly: present 0.39 > absent 0.10, no outlier)"
    tier: fast
    fast: "hardmap.claims.bets_claims:funnel_rn_v3new"
    artifact: eightfold/eightfold/results/atlas/atlas_v3_provenance.jsonl
    expected: {V_rn_present: 0.3887, V_rn_absent: 0.1043}
    tolerance:
      V_rn_present: {abs: 0.005}
      V_rn_absent: {abs: 0.005}
